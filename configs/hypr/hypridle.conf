general {
    lock_cmd = noctalia msg session lock
    before_sleep_cmd = noctalia msg session lock
    after_sleep_cmd = noctalia msg dpms-on
}

listener {
    timeout = 300                              # 5min
    on-timeout = noctalia msg session lock     # lock screen when timeout has passed
}

listener {
    timeout = 330                                                                 # 5.5min
    on-timeout = noctalia msg dpms-off           # screen off when timeout has passed
    on-resume = noctalia msg dpms-on             # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 600                                           # 10min
    on-timeout = noctalia msg session suspend               # suspend computer
}